# Migrated from pyglotaran v0.7 for v0.8 staging validation.
library:
  complex670:
    type: kinetic
    rates:
      (Bulk, Ant1): rates.ToBulkFromAnt1
      (Ant1, Bulk): rates.ToAnt1FromBulk
      (Bulk, Red1): rates.ToBulkFromRed1
      (Red1, Bulk): rates.ToRed1FromBulk
      (Bulk, Red2): rates.ToBulkFromRed2
      (Red2, Bulk): rates.ToRed2FromBulk
      (Red1, Red1): rates.kF
      (Red2, Red2): rates.kF
      (Bulk, Bulk): rates.kF
      (WLRC, WLRP1): rates.ToWLRCFromWLRP1
      (WLRP1, WLRC): rates.ToWLRP1FromWLRC
      (Bulk, WLRC): rates.ToBulkFromWLRC
      (WLRC, Bulk): rates.ToWLRCFromBulk
      (WLRP2, WLRP1): rates.ToWLRP2FromWLRP1
      (WLRP2, WLRP2): rates.ToWLRP2FromWLRP2
      (freeChl, freeChl): rates.kF
    clp_constraints:
    - type: zero
      target: freeChl
      interval:
      - - 690
        - 731
    - type: zero
      target: freeChl
      interval:
      - - 750
        - 760
  complex700:
    type: kinetic
    rates:
      (Bulk, Ant1): rates.ToBulkFromAnt1
      (Ant1, Bulk): rates.ToAnt1FromBulk
      (Bulk, Red1): rates.ToBulkFromRed1
      (Red1, Bulk): rates.ToRed1FromBulk
      (Bulk, Red2): rates.ToBulkFromRed2
      (Red2, Bulk): rates.ToRed2FromBulk
      (Red1, Red1): rates.kF
      (Red2, Red2): rates.kF
      (Bulk, Bulk): rates.kF
      (WLRC, WLRP1): rates.ToWLRCFromWLRP1
      (WLRP1, WLRC): rates.ToWLRP1FromWLRC
      (Bulk, WLRC): rates.ToBulkFromWLRC
      (WLRC, Bulk): rates.ToWLRCFromBulk
      (WLRP2a, WLRP1): rates.ToWLRP2FromWLRP1
      (WLRP2a, WLRP2a): rates.ToWLRP2FromWLRP2
  mc2:
    type: clp-guide
    target: Red1
    dimension: time
  mc3:
    type: clp-guide
    target: Red2
    dimension: time
  mc4:
    type: clp-guide
    target: WLRC
    dimension: time
  mc5:
    type: clp-guide
    target: WLRP1
    dimension: time
  doas:
    type: damped-oscillation
    oscillations:
      osc1:
        frequency: osc.freq.1
        rate: osc.rates.1
  artifact670:
    type: coherent-artifact
    order: 3
  artifact700:
    type: coherent-artifact
    order: 3
experiments:
  default:
    residual_function: variable_projection
    datasets:
      670TR1:
        elements:
        - complex670
        - doas
        - artifact670
        activations:
          irf:
            type: gaussian
            compartments:
              Ant1: input670.Ant1
              Bulk: input670.Bulk
              Red1: input670.Red1
              Red2: input670.Red2
              WLRC: input670.WLRC
              WLRP1: input670.0
              WLRP2: input670.0
              freeChl: input670.freeChl
              osc1: 1
              artifact670: 1
            center: irf.center1
            width: irf.width1
            dispersion_center: irf.dispcenter
            center_dispersion_coefficients: &id001
            - irf.disp1
            reciproke_global_axis: true
      670TR2:
        elements:
        - complex670
        activations:
          irf:
            type: gaussian
            compartments:
              Ant1: input670.Ant1
              Bulk: input670.Bulk
              Red1: input670.Red1
              Red2: input670.Red2
              WLRC: input670.WLRC
              WLRP1: input670.0
              WLRP2: input670.0
              freeChl: input670.freeChl
            center: irf.center1
            width: irf.width1
            dispersion_center: irf.dispcenter
            center_dispersion_coefficients: *id001
            reciproke_global_axis: true
      700TR1:
        elements:
        - complex700
        - artifact700
        activations:
          irf:
            type: gaussian
            compartments:
              Ant1: input700.Ant1
              Bulk: input700.Bulk
              Red1: input700.Red1
              Red2: input700.Red2
              WLRC: input700.WLRC
              WLRP1: input700.0
              WLRP2a: input700.0
              artifact700: 1
            center: irf.center2
            width: irf.width2
            dispersion_center: irf.dispcenter
            center_dispersion_coefficients: &id002
            - irf.disp1
            reciproke_global_axis: true
      700TR2:
        elements:
        - complex700
        activations:
          irf:
            type: gaussian
            compartments:
              Ant1: input700.Ant1
              Bulk: input700.Bulk
              Red1: input700.Red1
              Red2: input700.Red2
              WLRC: input700.WLRC
              WLRP1: input700.0
              WLRP2a: input700.0
            center: irf.center2
            width: irf.width2
            dispersion_center: irf.dispcenter
            center_dispersion_coefficients: *id002
            reciproke_global_axis: true
      Red1SADS:
        elements:
        - mc2
        weights:
        - global_interval:
          - 100
          - 1000
          value: 0.006
      Red2SADS:
        elements:
        - mc3
        weights:
        - global_interval:
          - 100
          - 1000
          value: 0.006
      WLRCSADS:
        elements:
        - mc4
        weights:
        - global_interval:
          - 100
          - 1000
          value: 0.006
      WLRP1SADS:
        elements:
        - mc5
        weights:
        - global_interval:
          - 100
          - 1000
          value: 0.006
    clp_link_tolerance: 0.1
    scale:
      670TR1: scale.670
      670TR2: scale.670TR2
      700TR1: scale.700
      700TR2: scale.700TR2
      Red1SADS: scale.Red1SADS
      Red2SADS: scale.Red2SADS
      WLRCSADS: scale.WLRCSADS
      WLRP1SADS: scale.WLRP1SADS
    clp_relations:
    - source: WLRP2
      target: WLRP2a
      parameter: rel.r1
      interval:
      - - 0
        - 1000
